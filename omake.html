<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>おまけの声 確認用</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%F0%9F%8E%81%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/style.css?v=20261009c">
<link rel="stylesheet" href="assets/kakunin.css?v=20261009c">
<style>
/* このページだけの、聞き分け用の並び */
.oc { max-width: 620px; margin: 0 auto 26px; }
.oc h2 {
  margin: 26px 0 6px; font-size: 18px;
  padding-bottom: 8px; border-bottom: 3px solid var(--ki-line);
}
.oc p.oc-lead { margin: 0 0 16px; font-size: 14px; color: var(--ki-muted); }
.oc-list { display: grid; gap: 10px; margin: 0; padding: 0; list-style: none; }
.oc-item {
  display: flex; align-items: center; gap: 13px;
  padding: 12px 15px; background: #fff;
  border: 2px solid var(--ki-line); border-radius: 14px;
}
.oc-no {
  width: 32px; height: 32px; flex: none; border-radius: 50%;
  background: var(--ki-mustard); border: 2px solid var(--ki-line);
  display: flex; align-items: center; justify-content: center;
  font-size: 15px; font-weight: 900;
}
.oc-item .voice { flex: 1; min-width: 0; }
</style>
</head>
<body>

<div class="pv-bar">
  <b>おまけの声の確認用です。</b>
  どの番号がどのメッセージか、聞いて教えてください。<br>
  下では、実際の出かたも見られます。
</div>

<section class="oc">
  <h2>① 6本を聞き分ける</h2>
  <p class="oc-lead">送っていただいた順に番号をつけています。4番が寝るメッセージです。</p>
  <ul class="oc-list" id="list"></ul>
</section>

<section class="oc">
  <h2>② 実際の出かた</h2>
  <p class="oc-lead">
    気持ちのボタンを押すと、結果の下におまけが出ます。
    本番は<b>3回に1回</b>、文章を読み終わるころ（5秒後）に出ますが、このページでは確認しやすいように<b>毎回・1.2秒後</b>に出します。
  </p>
</section>

<div id="app"></div>

<script src="assets/colors.js?v=20261009c"></script>
<script src="assets/character.js?v=20261009c"></script>
<script src="assets/versions.js?v=20261009c"></script>
<script src="assets/voices.js?v=20261009c"></script>
<script src="assets/cheers.js?v=20261009c"></script>
<script src="assets/app.js?v=20261009c"></script>
<script>
/* このページだけの割り当て。ふだんのページには出ない。 */
KI.CHEER_RATE = 1;      /* 確認しやすいように毎回出す */
KI.CHEER_DELAY = 1200;  /* 待ち時間も短くする（本番は5秒） */

/* ①の聞き分け用の並びを作る */
(function () {
  var list = document.getElementById('list');
  KI.CHEERS.forEach(function (c, i) {
    var li = document.createElement('li');
    li.className = 'oc-item';
    var no = document.createElement('span');
    no.className = 'oc-no';
    no.textContent = String(i + 1);
    li.appendChild(no);
    li.appendChild(KI.buildVoiceBar(KI.VOICE_DIR + c.file, (i + 1) + '番'));
    list.appendChild(li);
  });
})();

KI.init('personal');
</script>
</body>
</html>
