<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>きょうのいろ</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%F0%9F%8E%A8%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div id="app"></div>
<script src="assets/colors.js"></script>
<script src="assets/character.js"></script>
<script src="assets/versions.js"></script>
<script src="assets/app.js"></script>
<script>
(function () {
  var root = document.getElementById('app');

  var header = document.createElement('header');
  header.className = 'ki-header';
  var h1 = document.createElement('h1');
  h1.className = 'ki-logo';
  var colors = ['#E60033', '#F08300', '#F8B500', '#00A960', '#0068B7', '#884898'];
  var tilts = [-8, 5, -4, 7, -6, 4];
  'きょうのいろ'.split('').forEach(function (ch, i) {
    var s = document.createElement('span');
    s.className = 'ki-logo-char';
    s.textContent = ch;
    s.style.color = colors[i];
    s.style.transform = 'rotate(' + tilts[i] + 'deg)';
    h1.appendChild(s);
  });
  header.appendChild(h1);
  root.appendChild(header);

  var main = document.createElement('main');
  main.className = 'ki-index';

  var lead = document.createElement('p');
  lead.className = 'ki-lead';
  lead.textContent = '今日のあなたは、何色でしょう。気分をひとつ選ぶだけで、今日をあと押しする色がひとつ決まります。';
  main.appendChild(lead);

  var pick = document.createElement('p');
  pick.className = 'ki-pick';
  pick.textContent = 'まずは、どの自分で選びますか？';
  main.appendChild(pick);

  var cards = document.createElement('div');
  cards.className = 'ki-cards';

  /* 気持ちのボタンはここでは見せない。代わりにキャラクターの顔を出して、
   * 3つのうちどれを選ぶか、で迷ってもらう。 */
  var descs = {
    personal: '「わたし」個人としての気分で選ぶ。今日どんな自分でいたいか。',
    business: '会議・商談・初対面。相手にどう見せたいかで、戦略的に選ぶ。仕事に色の力を借りる日に。',
    kids: 'きょうの きぶんで、すきな いろを えらんでみよう。'
  };
  /* 3つが並んだときに見分けがつくよう、顔の後ろの色をVerごとに変える */
  var faceBgs = { personal: '#FFE0EC', business: '#D6E8F7', kids: '#FFECAE' };
  var invites = {
    personal: '気分を選んでみる',
    business: '見せたい自分を選ぶ',
    kids: 'きぶんを えらぶ'
  };

  ['personal', 'business', 'kids'].forEach(function (id) {
    var v = KI.VERSIONS[id];
    var a = document.createElement('a');
    a.className = 'ki-card';
    a.href = id + '.html';

    var face = document.createElement('div');
    face.className = 'ki-card-face';
    face.style.background = faceBgs[id];
    face.innerHTML = KI.renderFace(id);
    a.appendChild(face);

    var h2 = document.createElement('h2');
    h2.textContent = v.label;
    a.appendChild(h2);

    var p = document.createElement('p');
    p.textContent = descs[id];
    a.appendChild(p);

    var go = document.createElement('span');
    go.className = 'ki-card-go';
    go.textContent = invites[id] + ' →';
    a.appendChild(go);

    cards.appendChild(a);
  });
  main.appendChild(cards);
  root.appendChild(main);
})();
</script>
</body>
</html>
